<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>한글 편지의 비밀</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
/* --k: 게임 1픽셀의 화면 크기(정수 배율), --u: 픽셀 폰트 배율 — 둘 다 JS가 화면에 맞춰 정함 */
:root{--k:3;--u:2;--p:calc(var(--k) * 1px);--f:calc(var(--u) * 12px);--fs:calc(var(--u) * 10px);
  --line:#e6e9f8;--text:#f4f4ff;--accent:#ffd23f;--ok:#7be08f;--bad:#ff8a8a;--cur:none;--down:none}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0a14;color:var(--text);font-family:'Galmuri11','Galmuri9',monospace;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:none;font-smooth:never}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{font-family:inherit}
#wrap{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#game{position:relative;width:864px;aspect-ratio:288/224;container-type:inline-size;overflow:hidden;background:#000;box-shadow:0 0 0 var(--p) #000,0 0 0 calc(var(--p) * 2) #4a4a6a}
#cv{display:block;width:100%;height:100%;image-rendering:crisp-edges;image-rendering:pixelated}
.hidden{display:none!important}

/* ---- 도트 창 스킨 ---- */
.win{
  background:
    conic-gradient(rgba(0,0,0,.12) 25%,transparent 0 50%,rgba(0,0,0,.12) 0 75%,transparent 0) 0 0/calc(var(--p) * 2) calc(var(--p) * 2),
    linear-gradient(180deg,#3a50aa 0 20%,#32469c 20% 40%,#2b3c8e 40% 60%,#253380 60% 80%,#1e2a70 80%);
  border:var(--p) solid #0c0f2a;
  box-shadow:inset 0 0 0 var(--p) #e6e9f8,inset 0 0 0 calc(var(--p) * 2) #6f7fcc;
  clip-path:polygon(var(--p) 0,calc(100% - var(--p)) 0,100% var(--p),100% calc(100% - var(--p)),calc(100% - var(--p)) 100%,var(--p) 100%,0 calc(100% - var(--p)),0 var(--p));
}
.cursor-after{position:relative}
.choice.sel::before,.mbtn.sel::before{content:'';position:absolute;left:calc(var(--p) * 4);top:50%;width:calc(var(--p) * 5);height:calc(var(--p) * 7);transform:translateY(-50%);background:var(--cur) 0 0/100% 100% no-repeat;image-rendering:pixelated;animation:nudge .6s steps(1) infinite}
@keyframes nudge{50%{transform:translate(var(--p),-50%)}}

/* ---- HUD (천장 띠 안) ---- */
#hud{position:absolute;top:calc(var(--p) * 2);left:calc(var(--p) * 3);right:calc(var(--p) * 3);height:calc(var(--p) * 12);display:flex;gap:calc(var(--p) * 2);font-family:'Galmuri7','Galmuri9',monospace;font-size:calc(var(--u) * 8px);pointer-events:none;z-index:2}
#hud .chip{display:flex;align-items:center;padding:0 calc(var(--p) * 5);white-space:nowrap}
#hud .sp{flex:1}
.hbtn{pointer-events:auto;color:var(--text);font:inherit;padding:0 calc(var(--p) * 5);cursor:pointer}
.hbtn:hover{color:var(--accent)}
#toast{position:absolute;left:50%;top:calc(var(--p) * 54);transform:translateX(-50%);padding:calc(var(--p) * 3) calc(var(--p) * 8);font-size:var(--f);opacity:0;pointer-events:none;z-index:5;white-space:nowrap;color:var(--accent)}
#toast.show{opacity:1}

/* ---- 대화창 ---- */
#dialog{position:absolute;left:calc(var(--p) * 4);right:calc(var(--p) * 4);bottom:calc(var(--p) * 4);min-height:calc(var(--p) * 60);padding:calc(var(--p) * 7) calc(var(--p) * 10);font-size:var(--f);line-height:1.55;z-index:3;cursor:pointer}
#dialog.hasface{padding-left:calc(var(--p) * 66)}
#dface{position:absolute;left:calc(var(--p) * 8);top:calc(var(--p) * 6);width:calc(var(--p) * 48);height:calc(var(--p) * 48);image-rendering:pixelated;background:#141a50;box-shadow:0 0 0 var(--p) #0c0f2a,0 0 0 calc(var(--p) * 2) var(--line)}
#dname{color:var(--accent);margin-bottom:calc(var(--p) * 1)}
#dtext{white-space:pre-wrap;word-break:keep-all}
#dnext{position:absolute;right:calc(var(--p) * 8);bottom:calc(var(--p) * 6);width:calc(var(--p) * 7);height:calc(var(--p) * 5);background:var(--down) 0 0/100% 100% no-repeat;image-rendering:pixelated;font-size:0;animation:bob .5s steps(1) infinite}
@keyframes bob{50%{transform:translateY(var(--p))}}
#choices{position:absolute;right:calc(var(--p) * 4);bottom:calc(var(--p) * 68);min-width:calc(var(--p) * 120);padding:calc(var(--p) * 4);z-index:4}
.choice{display:block;width:100%;text-align:left;font-size:var(--f);color:var(--text);background:none;border:0;padding:calc(var(--p) * 2) calc(var(--p) * 6) calc(var(--p) * 2) calc(var(--p) * 14);position:relative;cursor:pointer}
.choice.sel{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 var(--p) rgba(255,255,255,.7);animation:cur 1s steps(1) infinite}
@keyframes cur{50%{box-shadow:inset 0 0 0 var(--p) rgba(255,255,255,.3)}}

/* ---- 모달 / 패널 ---- */
#modal{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:calc(var(--p) * 8);
  background:conic-gradient(rgba(4,4,16,.6) 25%,transparent 0 50%,rgba(4,4,16,.6) 0 75%,transparent 0) 0 0/calc(var(--p) * 2) calc(var(--p) * 2)}
.panel{max-height:100%;overflow:auto;width:min(100%,calc(var(--p) * 200));padding:calc(var(--p) * 9) calc(var(--p) * 10);font-size:var(--f);line-height:1.5}
.ptitle{color:var(--accent);margin-bottom:calc(var(--p) * 4);text-align:center}
.note{font-family:'Galmuri9',monospace;font-size:var(--fs);opacity:.85;margin:calc(var(--p) * 2) 0;word-break:keep-all}
.warn{color:var(--bad);opacity:1}
.mbtn{display:block;width:100%;color:var(--text);font:inherit;font-size:var(--f);text-align:left;background:rgba(6,8,30,.35);border:var(--p) solid #8a96d8;padding:calc(var(--p) * 3) calc(var(--p) * 6) calc(var(--p) * 3) calc(var(--p) * 14);margin:calc(var(--p) * 3) 0;position:relative;cursor:pointer}
.mbtn.sel,.mbtn:hover{background:rgba(255,210,63,.16);border-color:var(--accent)}
.center .mbtn{text-align:center}
.erow{display:flex;gap:calc(var(--p) * 3)}
.erow .mbtn{text-align:center}
.shake{animation:shake .3s steps(1)}
@keyframes shake{25%{transform:translateX(calc(var(--p) * -3))}50%{transform:translateX(calc(var(--p) * 3))}75%{transform:translateX(calc(var(--p) * -2))}}

/* ---- 타이틀 ---- */
.panel.title{background:none;border:0;box-shadow:none;clip-path:none;width:min(100%,calc(var(--p) * 190));text-align:center}
.panel.title .mbtn{text-align:center;background:rgba(12,15,42,.88);margin:calc(var(--p) * 2) 0;padding-top:calc(var(--p) * 2);padding-bottom:calc(var(--p) * 2)}
.panel.title .mbtn.sel{background:rgba(90,70,10,.92)}
.tsub{color:var(--accent);letter-spacing:calc(var(--p) * 2)}
.panel.title h1{--ts:calc(var(--u) * 2px);font-size:calc(var(--u) * 36px);line-height:1.2;white-space:nowrap;font-weight:normal;color:#fff3c4;margin:calc(var(--p) * 2) 0;
  text-shadow:var(--ts) 0 0 #1e2a70,0 var(--ts) 0 #1e2a70,var(--ts) var(--ts) 0 #1e2a70,calc(var(--ts) * 2) calc(var(--ts) * 2) 0 #0c0f2a}
.tdesc{font-family:'Galmuri9',monospace;font-size:var(--fs);margin-bottom:calc(var(--p) * 3);word-break:keep-all;text-shadow:calc(var(--u) * 1px) calc(var(--u) * 1px) 0 #000}
.credit{font-family:'Galmuri9',monospace;font-size:var(--fs);opacity:.75;margin-top:calc(var(--p) * 2);text-shadow:calc(var(--u) * 1px) calc(var(--u) * 1px) 0 #000}

/* ---- 퀴즈 ---- */
.qplace{font-family:'Galmuri9',monospace;font-size:var(--fs);color:var(--accent)}
.qtext{margin:calc(var(--p) * 4) 0 calc(var(--p) * 6);word-break:keep-all}
.qc b{color:var(--accent);margin-right:calc(var(--p) * 3)}
.qinput{display:flex;gap:calc(var(--p) * 3)}
.qinput input{flex:1;min-width:0;font:inherit;font-size:var(--f);padding:calc(var(--p) * 3) calc(var(--p) * 4);border:var(--p) solid var(--line);background:#0b0d22;color:var(--text);outline:none}
.qinput .mbtn{width:auto;margin:0;padding:calc(var(--p) * 3) calc(var(--p) * 6);text-align:center;white-space:nowrap}
.qmsg{min-height:calc(var(--p) * 12);margin-top:calc(var(--p) * 3);color:var(--bad);text-align:center}
.qmsg.ok{color:var(--ok)}
.qfoot{text-align:right}
.sbtn{background:none;border:0;color:var(--text);opacity:.75;font-family:'Galmuri9',monospace;font-size:var(--fs);cursor:pointer;text-decoration:underline}

/* ---- 자물쇠 ---- */
.dials{display:flex;justify-content:center;gap:calc(var(--p) * 6);margin:calc(var(--p) * 6) 0}
.dial{display:flex;flex-direction:column;align-items:center;gap:calc(var(--p) * 2)}
.dial button{width:calc(var(--p) * 24);height:calc(var(--p) * 14);font-family:'Galmuri9',monospace;font-size:var(--fs);color:var(--text);background:rgba(6,8,30,.4);border:var(--p) solid #8a96d8;cursor:pointer}
.dnum{width:calc(var(--p) * 24);height:calc(var(--p) * 30);display:flex;align-items:center;justify-content:center;font-size:calc(var(--u) * 24px);background:#f2c14e;color:#3a2a10;border:var(--p) solid #2b1d1d;box-shadow:inset 0 calc(var(--p) * -3) 0 #c8962a,inset 0 var(--p) 0 #ffe9a0;cursor:pointer}
.dial.sel .dnum{outline:var(--p) solid #fff;outline-offset:var(--p)}

/* ---- 가방 / 엔딩 / 기록 ---- */
.bitem{display:flex;gap:calc(var(--p) * 6);align-items:center;padding:calc(var(--p) * 3) 0;border-bottom:var(--p) dashed rgba(255,255,255,.22)}
.bicon{width:calc(var(--p) * 18);height:calc(var(--p) * 18);flex:none;display:flex;align-items:center;justify-content:center;background:rgba(6,8,30,.4);box-shadow:inset 0 0 0 var(--p) #8a96d8;color:var(--accent)}
.bdesc{font-family:'Galmuri9',monospace;font-size:var(--fs);opacity:.85}
.cbig{font-size:calc(var(--u) * 24px);text-align:center;color:var(--accent);text-shadow:calc(var(--u) * 2px) calc(var(--u) * 2px) 0 #0c0f2a}
.cstats{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--p) * 2) calc(var(--p) * 6);margin:calc(var(--p) * 5) 0}
.cstats span{color:var(--accent)}
.cnext{text-align:center;opacity:.85;font-family:'Galmuri9',monospace;font-size:var(--fs)}

.egrid{display:grid;grid-template-columns:1fr 1fr;gap:0 calc(var(--p) * 6);text-align:left}
.egrid .bitem{align-items:flex-start}
.egrid .bicon{width:calc(var(--p) * 14);height:calc(var(--p) * 14);font-size:var(--fs)}
.panel:has(.egrid){width:min(100%,calc(var(--p) * 272))}

.eopen{cursor:pointer}
.eopen:hover b{color:var(--accent)}
.ereplay{font-family:'Galmuri9',monospace;font-size:var(--fs);color:var(--accent);margin-top:var(--p)}
.cgview{width:min(100%,calc(var(--p) * 244));text-align:center;cursor:pointer;padding-top:calc(var(--p) * 6);padding-bottom:calc(var(--p) * 6)}
.cgview .ptitle{margin-bottom:calc(var(--p) * 3)}
.cghead{font-family:'Galmuri9',monospace;font-size:var(--fs);color:var(--accent);opacity:.85;letter-spacing:var(--p)}
.cgframe{display:inline-block;padding:var(--p);background:#0c0f2a;box-shadow:0 0 0 var(--p) var(--line)}
#cg{display:block;width:calc(var(--p) * 160);height:calc(var(--p) * 96);image-rendering:pixelated}
.cgtext{min-height:calc(var(--p) * 30);text-align:left;margin-top:calc(var(--p) * 5);white-space:pre-wrap;word-break:keep-all}
.cgfoot{display:flex;justify-content:space-between;align-items:center;margin-top:calc(var(--p) * 2);font-family:'Galmuri9',monospace;font-size:var(--fs);opacity:.85}
.cgnext{display:inline-block;width:calc(var(--p) * 7);height:calc(var(--p) * 5);margin-left:calc(var(--p) * 4);background:var(--down) 0 0/100% 100% no-repeat;image-rendering:pixelated;animation:bob .5s steps(1) infinite}
table.rec{width:100%;border-collapse:collapse;font-family:'Galmuri9',monospace;font-size:var(--fs)}
table.rec th,table.rec td{padding:calc(var(--p) * 2);border-bottom:var(--p) solid rgba(255,255,255,.18);text-align:center}
table.rec th{color:var(--accent);font-weight:normal}

/* ---- 아이템 칸 / 가방 / 대화 기록 ---- */
.iicon{display:block;width:100%;height:100%;background:center/contain no-repeat;image-rendering:pixelated}
.hslots{display:flex;gap:calc(var(--p) * 1);pointer-events:auto}
.hslot{width:calc(var(--p) * 12);height:calc(var(--p) * 12);padding:calc(var(--p) * 1);cursor:pointer;clip-path:none;box-shadow:inset 0 0 0 var(--p) #6f7fcc}
.slots{display:grid;grid-template-columns:repeat(4,calc(var(--p) * 24));gap:calc(var(--p) * 3);justify-content:center;margin:calc(var(--p) * 2) 0 calc(var(--p) * 5)}
.slot{width:calc(var(--p) * 24);height:calc(var(--p) * 24);padding:calc(var(--p) * 3);background:rgba(6,8,30,.45);border:var(--p) solid #0c0f2a;box-shadow:inset 0 0 0 var(--p) #6f7fcc;cursor:pointer}
.slot.sel{box-shadow:inset 0 0 0 var(--p) #fff,inset 0 0 0 calc(var(--p) * 2) var(--accent);animation:cur 1s steps(1) infinite}
.idesc{min-height:calc(var(--p) * 36);padding:calc(var(--p) * 5) calc(var(--p) * 7)}
.idesc b{color:var(--accent);font-weight:normal}
.logbox{max-height:calc(var(--p) * 110);overflow:auto;padding-right:calc(var(--p) * 2)}
.logline{padding:calc(var(--p) * 2) 0;border-bottom:var(--p) dashed rgba(255,255,255,.18);font-family:'Galmuri9',monospace;font-size:var(--fs);word-break:keep-all}
.logname{color:var(--accent);margin-right:calc(var(--p) * 3)}
.logname::after{content:' :'}

/* ---- 선생님 설정 ---- */
.panel.editor{width:min(100%,calc(var(--p) * 264));font-family:'Galmuri9',monospace;font-size:var(--fs)}
.panel.editor .ptitle{font-family:'Galmuri11',monospace;font-size:var(--f)}
fieldset{border:var(--p) solid rgba(255,255,255,.3);padding:calc(var(--p) * 4) calc(var(--p) * 6);margin:calc(var(--p) * 4) 0}
legend{color:var(--accent);padding:0 calc(var(--p) * 2)}
.editor label{display:block;margin:calc(var(--p) * 2) 0}
.editor input,.editor textarea,.editor select{display:block;width:100%;margin-top:var(--p);font:inherit;padding:calc(var(--p) * 2) calc(var(--p) * 3);border:var(--p) solid rgba(255,255,255,.4);background:#0b0d22;color:var(--text)}
.editor .mbtn{font-size:var(--fs);padding:calc(var(--p) * 3)}
.f-choices{display:grid;grid-template-columns:1fr 1fr;gap:0 calc(var(--p) * 4)}
.emsg{color:var(--bad);min-height:calc(var(--p) * 10);text-align:center}
.emsg.ok{color:var(--ok)}
details{margin-top:calc(var(--p) * 4)}
summary{cursor:pointer;opacity:.85}

/* ---- 터치 패드 ---- */
#pad{display:none;width:min(98vw,640px);height:132px;align-items:center;justify-content:space-between;padding:0 12px}
@media (hover:none),(pointer:coarse){#pad{display:flex}}
.dpad{position:relative;width:132px;height:132px}
.dpad button,.abtns button{color:var(--text);font-family:inherit;background:#253380;border:3px solid #0c0f2a;box-shadow:inset 0 0 0 3px #e6e9f8,inset 0 0 0 6px #6f7fcc;touch-action:none}
.dpad button{position:absolute;width:44px;height:44px;font-size:16px}
.dpad button[data-d=up]{left:44px;top:0}
.dpad button[data-d=left]{left:0;top:44px}
.dpad button[data-d=right]{left:88px;top:44px}
.dpad button[data-d=down]{left:44px;top:88px}
.abtns{display:flex;align-items:center;gap:16px}
#pA{width:80px;height:80px;font-size:16px;background:#8a2a3a}
#pBag{width:60px;height:60px;font-size:14px}
.dpad button:active,.abtns button:active{filter:brightness(1.4)}
/* ---- 한글 편지의 비밀 전용 ---- */
#hud .chip.shard{gap:var(--p);padding:0 calc(var(--p) * 4)}
.sh{display:inline-block;width:calc(var(--p) * 7);height:calc(var(--p) * 7);background:var(--shard0) 0 0/100% 100% no-repeat;image-rendering:pixelated}
.sh.on{background-image:var(--shard)}
.hcards{margin-left:calc(var(--p) * 3)}
#goal{position:absolute;top:calc(var(--p) * 17);left:calc(var(--p) * 3);max-width:calc(var(--p) * 180);padding:calc(var(--p) * 2) calc(var(--p) * 5);font-family:'Galmuri9',monospace;font-size:var(--fs);z-index:2;pointer-events:none;opacity:.92}
#goal b{color:var(--accent);font-weight:normal;margin-right:calc(var(--p) * 2)}
.tgear{position:absolute;right:calc(var(--p) * 3);bottom:calc(var(--p) * 3);width:calc(var(--p) * 9);height:calc(var(--p) * 9);border:0;padding:0;background:var(--gear) 0 0/100% 100% no-repeat;image-rendering:pixelated;cursor:pointer;opacity:.85}
.tgear:hover{filter:brightness(1.35)}
.panel.puzzle{width:min(100%,calc(var(--p) * 240))}
.flagcv{width:calc(var(--p) * 120);height:calc(var(--p) * 80);image-rendering:pixelated;cursor:pointer;box-shadow:0 0 0 var(--p) var(--line)}
.tris{display:grid;grid-template-columns:repeat(4,1fr);gap:0 calc(var(--p) * 2);margin-top:calc(var(--p) * 2)}
.tri span{font-family:'Galmuri9',monospace;font-size:var(--fs);line-height:1.2;text-align:left}
.tri{display:flex;align-items:center;gap:calc(var(--p) * 2);padding:calc(var(--p) * 2) calc(var(--p) * 2);margin:var(--p) 0}
.puzzle .qmsg{min-height:calc(var(--p) * 9);margin-top:var(--p)}
.tri.sel::before{display:none}
.tri img{width:calc(var(--p) * 13);height:calc(var(--p) * 13);image-rendering:pixelated;background:#fffdf6;box-shadow:0 0 0 var(--p) #0c0f2a}
.tri b{color:var(--accent);margin-right:var(--p)}
.letter{text-align:center;margin:calc(var(--p) * 2) 0}
.letter b{color:var(--accent);letter-spacing:var(--p)}
.cgrid{margin:calc(var(--p) * 3) auto;border-collapse:collapse}
.cgrid th{font-family:'Galmuri9',monospace;font-size:var(--fs);color:var(--accent);font-weight:normal;padding:0 calc(var(--p) * 2)}
.cell{width:calc(var(--p) * 18);height:calc(var(--p) * 15);font:inherit;font-size:var(--f);color:#2b1d1d;background:#f3ead2;border:var(--p) solid #8a6a40;cursor:pointer}
.cell:hover{background:#ffe9a0}
.cans{text-align:center;font-size:calc(var(--u) * 16px);color:var(--accent);min-height:calc(var(--p) * 14);letter-spacing:calc(var(--p) * 2)}
.slots8{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--p) * 2);margin:calc(var(--p) * 3) 0}
.pslot{min-height:calc(var(--p) * 13);display:flex;align-items:center;justify-content:center;border:var(--p) dashed rgba(255,255,255,.3);font-family:'Galmuri9',monospace;font-size:var(--fs);color:var(--accent)}
.wcards{display:flex;flex-wrap:wrap;gap:calc(var(--p) * 2);justify-content:center;margin:calc(var(--p) * 3) 0}
.wcard{font:inherit;font-size:var(--f);color:#2b1d1d;background:#fffaf0;border:var(--p) solid #8a6a40;padding:calc(var(--p) * 2) calc(var(--p) * 4);cursor:pointer;box-shadow:0 var(--p) 0 #8a6a40}
.wcard:hover{background:#ffe9a0}
.wcard:disabled{opacity:.25;cursor:default}
.tline{display:flex;gap:var(--p);justify-content:center;margin:calc(var(--p) * 3) 0}
.tnode{flex:1;min-height:calc(var(--p) * 24);display:flex;flex-direction:column;align-items:center;justify-content:center;border:var(--p) dashed rgba(255,255,255,.3);font-family:'Galmuri9',monospace;font-size:var(--fs);text-align:center;word-break:keep-all;padding:var(--p)}
.tnode.on{border-style:solid;border-color:var(--accent)}
.tnode b{color:var(--accent);font-weight:normal}
.eracard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--p) * 3);cursor:pointer;

<body>
<div id="wrap">
  <div id="game">
    <canvas id="cv" width="288" height="224"></canvas>
    <div id="hud" class="hidden">
      <div class="chip win" id="hInfo"></div>
      <div class="chip win shard" id="hShard"></div>
      <div class="sp"></div>
      <button class="hbtn win" id="hBandi">먹콩</button>
      <button class="hbtn win" id="hLog">기록</button>
      <button class="hbtn win" id="hBag">가방</button>
      <button class="hbtn win" id="hMenu">메뉴</button>
    </div>
    <div id="goal" class="win hidden"></div>
    <div id="toast" class="win"></div>
    <div id="dialog" class="win hidden"><canvas id="dface" width="16" height="16" class="hidden"></canvas><div id="dname"></div><div id="dtext"></div><div id="dnext" class="hidden">▼</div></div>
    <div id="choices" class="win hidden"></div>
    <div id="modal" class="hidden"></div>
  </div>
  <div id="pad">
    <div class="dpad"><button data-d="up">▲</button><button data-d="left">◀</button><button data-d="right">▶</button><button data-d="down">▼</button></div>
    <div class="abtns"><button id="pBandi">먹콩</button><button id="pBag">가방</button><button id="pA">조사</button></div>
  </div>
</div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
const T = 16, COLS = 18, ROWS = 14, W = COLS * T, H = ROWS * T;
const SPEED = 4.5;
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

/* ===================== 저장소 ===================== */
const K_SAVE = 'hangeul.save.v1', K_Q = 'hangeul.questions.v1', K_REC = 'hangeul.records.v1', K_MUTE = 'hangeul.mute', K_CARDS = 'hangeul.cards.v1', K_END = 'hangeul.endings.v1', K_BGM = 'hangeul.bgm';
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ===================== 상태 ===================== */
let S = null, mode = 'title', busy = false, modal = null, held = [];
const player = { x: 9, y: 12, tx: 9, ty: 12, dir: 'up', moving: false, t: 0, anim: 0, queued: null };
const bandi = { x: 9 * T, y: 12 * T };
function newState(name) {
  return { v: 1, name, era: 'e1', elapsed: 0, items: {}, flags: {}, cards: [], shards: 0, wrong: 0, hints: 0, caught: 0,
    player: null, cleared: false, recorded: false };
}
// 아이템은 개수로 관리 (0이면 없음)
const has = id => !!S && (S.items[id] || 0) > 0;
const count = id => (S && S.items[id]) || 0;
function give(id, n = 1, silent) { S.items[id] = count(id) + n; if (!silent) { sfx('get'); toast(`${ITEMS[id].name}${n > 1 ? ` ×${n}` : ''} 획득!`); } }
function take(id, n = 999) { S.items[id] = Math.max(0, count(id) - n); }
const F = () => S.flags;

/* ===================== 역사 카드 (게임 속 사실 정리) ===================== */
const CARDS = {
  jang:     { era: 'e1', year: '1434', name: '장영실과 자격루', text: '장영실은 동래현의 관노(관청에 딸린 노비) 출신이었지만, 재주를 알아본 세종이 궁궐로 불러 과학 기구를 만들게 했어요. 1434년 장영실 등이 만든 자격루는 정해진 시각이 되면 인형이 종·북·징을 쳐서 스스로 시각을 알려 주는 물시계예요.' },
  angbu:    { era: 'e1', year: '1434', name: '앙부일구', text: '솥을 하늘로 향해 놓은 것처럼 오목한 해시계예요. 그림자 끝이 가리키는 곳을 보고 시각과 절기를 알 수 있었어요. 종묘 앞과 혜정교 같은 길가에 두어 오가는 백성도 볼 수 있게 했고, 글을 모르는 백성을 위해 시각을 동물 그림으로 나타냈다고 전해져요.' },
  cheugu:   { era: 'e1', year: '1441', name: '측우기', text: '세종 때인 1441년, 비가 내린 양을 재는 측우기를 만들었어요. 이듬해부터 전국에 나누어 주고 비의 양을 기록하게 해서 농사에 활용했어요.' },
  honcheon: { era: 'e1', year: '1430년대', name: '간의와 혼천의', hidden: true, text: '세종 때에는 하늘의 해·달·별을 관측하는 간의와 혼천의도 만들었어요. 궁궐에 간의대라는 관측대를 세우고, 하늘을 살펴 우리 실정에 맞는 달력을 만드는 데 힘썼어요.' },
  changje:  { era: 'e2', year: '1443', name: '훈민정음 창제', text: '세종은 1443년 우리말을 소리 나는 대로 쉽게 적을 수 있는 글자, 훈민정음을 만들었어요. \'백성을 가르치는 바른 소리\'라는 뜻이에요. 자음 기본자 ㄱ·ㄴ·ㅁ·ㅅ·ㅇ은 소리를 낼 때의 발음 기관 모양을, 모음 ·, ㅡ, ㅣ는 하늘·땅·사람을 본떠 만들었어요.' },
  banpo:    { era: 'e2', year: '1446', name: '훈민정음 반포와 한글날', text: '1446년 세종은 훈민정음을 백성에게 널리 알렸어요(반포). 이를 기념하는 날이 10월 9일 한글날이에요. 글자를 만든 원리를 풀이한 책 『훈민정음』 해례본은 국보이자 유네스코 세계기록유산이에요.' },
  jiphyeon: { era: 'e2', year: '1420~', name: '집현전', hidden: true, text: '세종은 궁궐 안의 집현전을 크게 키워 젊은 학자들이 마음껏 학문을 연구하게 했어요. 집현전 학자들은 훈민정음 해례본을 쓰고, 여러 책을 펴내는 데 힘을 보탰어요.' },
  imjin:    { era: 'e3', year: '1592', name: '임진왜란', text: '1592년 4월, 일본군이 부산진을 공격하면서 임진왜란이 시작되었어요. 일본군은 빠르게 북쪽으로 올라왔고, 선조는 한양을 떠나 의주까지 피란했어요. 전쟁은 1598년까지 7년 동안 이어졌어요.' },
  uibyeong: { era: 'e3', year: '1592', name: '의병', text: '나라가 위태로워지자 양반, 농민, 승려 등 백성들이 스스로 군대를 만들어 싸웠어요. 이를 의병이라고 해요. 경상도 의령의 곽재우는 붉은 옷을 입고 싸워 \'홍의장군\'이라 불렸어요.' },
  jeongam:  { era: 'e3', year: '1592', name: '정암진 전투', hidden: true, text: '1592년 5월, 곽재우가 이끄는 의병은 의령의 정암진 나루에서 남강을 건너려던 일본군을 물리쳤어요. 이 승리로 일본군은 곡창 지대인 전라도로 가는 길을 쉽게 열지 못했어요.' },
  hansan:   { era: 'e4', year: '1592', name: '한산도 대첩', text: '1592년 7월, 이순신이 이끄는 조선 수군은 일본 수군을 넓은 한산도 앞바다로 유인한 뒤, 학이 날개를 펼친 모양의 학익진으로 에워싸 크게 물리쳤어요. 이 승리로 일본군은 바닷길로 군량을 나르기 어려워졌어요.' },
  geobuk:   { era: 'e4', year: '1592', name: '거북선', text: '거북선은 판옥선 위에 거북 등처럼 덮개를 씌우고, 덮개에 날카로운 쇠못을 꽂아 적이 뛰어오르지 못하게 한 돌격선이에요. 1592년 사천 해전에서 처음 싸움에 나섰어요.' },
  panok:    { era: 'e4', year: '1592', name: '판옥선과 격군', hidden: true, text: '조선 수군의 주력 배인 판옥선은 2층 구조로, 아래층에서는 격군들이 노를 젓고 위층에서는 군사들이 싸웠어요. 바닥이 평평해 제자리에서 방향을 바꾸기 쉬웠어요.' },
  noryang:  { era: 'e5', year: '1598', name: '노량 해전과 이순신', text: '1598년 11월, 이순신은 노량 앞바다에서 물러가는 일본 수군과 마지막 싸움을 벌이다 총탄에 맞았어요. "싸움이 급하니 내가 죽었다는 말을 하지 말라"는 말을 남겼다고 전해져요. 이 싸움을 끝으로 7년 전쟁이 끝났어요.' },
  nanjung:  { era: 'e5', year: '1592~1598', name: '난중일기', hidden: true, text: '이순신이 임진왜란 동안 쓴 일기예요. 전투 이야기뿐 아니라 어머니를 그리워하는 마음, 병사들 걱정 같은 솔직한 마음이 담겨 있어요. 국보이자 유네스코 세계기록유산이에요.' }
};
const CARD_ORDER = ['jang', 'angbu', 'cheugu', 'honcheon', 'changje', 'banpo', 'jiphyeon', 'imjin', 'uibyeong', 'jeongam', 'hansan', 'geobuk', 'panok', 'noryang', 'nanjung'];
function giveCard(id) {
  if (S.cards.includes(id)) return false;
  S.cards.push(id);
  const all = store.get(K_CARDS, []); if (!all.includes(id)) { all.push(id); store.set(K_CARDS, all); }
  sfx('card'); toast(`역사 카드 「${CARDS[id].name}」 획득!${CARDS[id].hidden ? ' (숨은 카드)' : ''}`, 2600);
  return true;
}

/* ===================== 문제 (선생님이 바꿀 수 있음) ===================== */
const Q_LABEL = {
  e1a: '1441 · 장영실 나리', e1b: '1441 · 보루각 관리',
  e2a: '1446 · 집현전 학사', e2b: '1446 · 덕이의 편지',
  e3a: '1592 · 의병 대장', e3b: '1592 · 마을 훈장',
  e4a: '1592 · 이순신 장군', e4b: '1592 · 거북선 군관',
  e5a: '1598 · 늙은 격군', e5b: '1598 · 먹콩의 마지막 문제'
};
const Q_KEYS = Object.keys(Q_LABEL);
const DEFAULT_Q = {
  e1a: { type: 'choice', q: '정해진 시각이 되면 인형이 종과 북을 쳐서 스스로 시각을 알려 주는 물시계는 무엇일까요?', choices: ['자격루', '앙부일구', '측우기', '혼천의'], a: '1' },
  e1b: { type: 'choice', q: '오목한 솥 모양으로, 그림자를 보고 시각을 알 수 있게 만든 해시계는 무엇일까요?', choices: ['앙부일구', '자격루', '측우기', '거중기'], a: '1' },

function tone(f, t0, dur, type = 'square', vol = .05) {

function sfx(n) {

  if (n === 'ok') { tone(784, t, .1); tone(1047, t + .1, .16); }

  if (n === 'slip') { for (let i = 0; i < 10; i++) tone(300 + i * 120, t + i * .05, .12, 'triangle', .04); }

  if (n === 'caught') { tone(392, t, .12, 'square', .05); tone(330, t + .12, .25, 'square', .05); }

}

function norm(s) { return String(s).replace(/[\s,]/g, '').replace(/\.$/, '').toLowerCase(); }
function matches(input, ans) {
  const a = norm(input); if (!a) return false;
  return String(ans).split('|').some(x => {
    const b = norm(x); if (!b) return false; if (a === b) return true;

function choose(opts) {
  return new Promise(res => {

// 가로:세로 = 3:2, 태극 지름 = 세로의 1/2, 태극은 건(왼쪽 위)과 곤(오른쪽 아래)을 잇는 대각선을 따라 atan(2/3)만큼 기울어짐.

function flagColor(dx, dy, w, place = FLAG_FULL) {
  const u = w / 144, r = 24 * u;

    let red = yr > 0;
    if ((xr + r / 2) ** 2 + yr * yr <= (r / 2) ** 2) red = true;
    if ((xr - r / 2) ** 2 + yr * yr <= (r / 2) ** 2) red = false;
    return red ? TG_RED : TG_BLUE;

    const tri = place[c]; if (!tri) continue;
    const { a, b } = triFrame(c, dx, dy);

    modal.onDir = d => { const x = cur % SEA_W, y = (cur / SEA_W) | 0; const [dx, dy] = DIRS[d]; cur = Math.max(0, Math.min(SEA_H - 1, y + dy)) * SEA_W + Math.max(0, Math.min(SEA_W - 1, x + dx)); draw(); };

    const el = openModal(`<div class="panel win puzzle">

function showStoryScene({ cg, head, title, pages, done }) {
  return new Promise(resolve => {
    const el = openModal(`<div class="panel win cgview">
      <div class="cghead">${head}</div><div class="ptitle">${title}</div>
      <div class="cgframe"><canvas id="cg" width="${CGW}" height="${CGH}"></canvas></div>

      <div class="cgfoot"><span id="cgpage"></span><span><button class="sbtn" id="cgskip">건너뛰기 (Esc)</button><span class="cgnext" id="cgnext"></span></span></div></div>`, {
      guard: true, onConfirm: () => next(), onKey: e => { if (e.key === 'Escape') { finish(); return true; } return false; }
    });
    const prevForce = bgmForce; bgmForce = sceneMood(cg);
    const cv2 = el.querySelector('#cg'), g = cv2.getContext('2d'), tx = el.querySelector('#cgtext');
    let i = 0, typing = false, timer = null, ended = false;
    const finish = () => { if (ended) return; ended = true; clearInterval(timer); bgmForce = prevForce; closeModal(); (done || (() => {}))(); resolve(); };
    const show = () => {
      const full = pages[i]; let n = 0; typing = true; clearInterval(timer);
      el.querySelector('#cgpage').textContent = `${i + 1} / ${pages.length}`; el.querySelector('#cgnext').classList.add('hidden');
      timer = setInterval(() => { n++; tx.textContent = full.slice(0, n); if (n >= full.length) { clearInterval(timer); typing = false; el.querySelector('#cgnext').classList.remove('hidden'); } }, 32);
    };
    const next = () => { if (typing) { clearInterval(timer); tx.textContent = pages[i]; typing = false; el.querySelector('#cgnext').classList.remove('hidden'); return; } if (++i >= pages.length) return finish(); show(); };
    el.querySelector('.cgview').addEventListener('click', e => { if (!e.target.closest('#cgskip')) next(); });
    el.querySelector('#cgskip').onclick = finish;
    const loop = now => { if (!cv2.isConnected || ended) return; drawCG(cg, g, now / 1000); requestAnimationFrame(loop); };
    requestAnimationFrame(loop); show();
  });
}

function qUnpack(t) { const s = atob(t.replace(/-/g, '+').replace(/_/g, '/')), k = new TextEncoder().encode(QL_KEY); const b = Uint8Array.from(s, (c, i) => c.charCodeAt(0) ^ k[i % k.length]); return JSON.parse(new TextDecoder().decode(b)); }
function qLinkURL(d) { return location.href.split('#')[0] + '#q=' + qPack(d); }
function applyQLink() {
  const m = location.hash.match(/[#&]q=([A-Za-z0-9_-]+)/); if (!m) return;
  try { const d = qUnpack(m[1]); if (qLinkApply(d)) setTimeout(() => toast('선생님이 보낸 문제로 바뀌었어요!', 3500), 700); } catch (e) {}
  try { history.replaceState(null, '', location.href.split('#')[0]); } catch (e) {}
}

function bindLinkBox(el, makeData, show) {
  el.querySelector('#elink').onclick = () => { const d = makeData(); if (!d) return; el.querySelector('#elinkout').value = qLinkURL(d); show(location.protocol === 'file:' ? '링크를 만들었어요. 다만 지금은 파일로 열어서, 이 주소는 이 컴퓨터에서만 열려요. 인터넷 주소로 연 다음 다시 만들어 주세요.' : '링크를 만들었어요! 복사해서 학생들에게 나눠 주세요.', true); };

let hudKey = '';

function pwHash(v) { let h = 5381; for (const c of 'frozen-school:' + v) h = (Math.imul(h, 33) ^ c.charCodeAt(0)) >>> 0; return h.toString(36); }
function pwModal(title, bodyHtml, onOk, onBack) {
  const el = openModal(`<div class="panel win"><div class="ptitle">${title}</div>${bodyHtml}
    <div class="qmsg" id="pmsg"></div>
    <div class="erow"><button class="mbtn" id="pok">확인</button><button class="mbtn" id="pback">뒤로</button></div></div>`, {
    onKey: e => { if (e.key === 'Enter') { onOk(); return true; } if (e.key === 'Escape') { onBack(); return true; } return false; }
  });
  el.querySelector('#pok').onclick = onOk; el.querySelector('#pback').onclick = onBack;
  setTimeout(() => { const i = el.querySelector('input'); i && i.focus(); }, 60);
  const msg = el.querySelector('#pmsg'), panel = el.querySelector('.panel');
  return { el, fail(t) { msg.textContent = t; sfx('wrong'); panel.classList.remove('shake'); void panel.offsetWidth; panel.classList.add('shake'); } };
}

    if (allHidden) return 'detective';
    if (S.hints >= 8) return 'buddy';
    if (S.hints === 0) return 'solo';

  audioInit();
  if (modal) {
    if (modal.onKey && modal.onKey(e)) { e.preventDefault(); return; }
    if (isTyping(e.target)) return;
    const d = KEYDIR[e.code];
    if (d) { e.preventDefault(); pressDir(d); return; }
    if (isConfirm(e)) { e.preventDefault(); if (!e.repeat) confirmPress(); }
    return;
  }
  if (isTyping(e.target)) return;
  const d = KEYDIR[e.code];
  if (d) { e.preventDefault(); if (!e.repeat || C.active) pressDir(d); return; }
  if (isConfirm(e)) { e.preventDefault(); if (!e.repeat) confirmPress(); return; }
  if (!canOpenMenu()) return;
  if (e.code === 'KeyI') openBag();
  if (e.code === 'KeyL') openLog();
  if (e.code === 'KeyH') runEvent(askBandi);
  if (e.key === 'Escape') openPause();
});
addEventListener('keyup', e => { const d = KEYDIR[e.code]; if (d) releaseDir(d); });
addEventListener('blur', () => { held = []; });
addEventListener('pointerdown', audioInit);
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('button'); if (b) setTimeout(() => b.blur(), 0); });
document.addEventListener('contextmenu', e => { if (e.target.closest('#pad')) e.preventDefault(); });
document.querySelectorAll('.dpad button').forEach(b => {
  const d = b.dataset.d;
  b.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); pressDir(d); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => b.addEventListener(ev, () => releaseDir(d)));
});
$('#pA').addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); confirmPress(); });
$('#pBag').addEventListener('pointerdown', e => { e.preventDefault(); if (canOpenMenu()) openBag(); });
$('#pBandi').addEventListener('pointerdown', e => { e.preventDefault(); if (canOpenMenu()) runEvent(askBandi); });
$('#hBag').onclick = () => { if (canOpenMenu()) openBag(); };
$('#hLog').onclick = () => { if (canOpenMenu()) openLog(); };
$('#hMenu').onclick = () => { if (canOpenMenu()) openPause(); };
$('#hBandi').onclick = () => { if (canOpenMenu()) runEvent(askBandi); };
$('#dialog').addEventListener('click', () => { if (!C.active) advanceDialog(); });

/* ===================== 업데이트 ===================== */
let saveAcc = 0;
function update(dt) {
  const playing = mode === 'play' && S && !S.cleared;
  if (playing && (!modal || modal.timeRuns)) S.elapsed += dt;
  if (player.moving) {
    player.t += dt * SPEED; player.anim += dt;
    if (player.t >= 1) { player.x = player.tx; player.y = player.ty; player.moving = false; player.t = 0; }
  }
  if (!player.moving && playing && !busy && !modal && !C.active) {
    const d = held[held.length - 1] || player.queued; player.queued = null;
    if (d) { player.dir = d; const [dx, dy] = DIRS[d], nx = player.x + dx, ny = player.y + dy; if (walkable(nx, ny)) Object.assign(player, { moving: true, tx: nx, ty: ny, t: 0 }); }
  }
  if (!player.moving) player.anim = 0;
  if (mode !== 'play' || (!busy && !modal)) updateNPCs(dt);
  const pp = charPix(player), k = Math.min(1, dt * 3.5);
  bandi.x += (pp.x - 10 - bandi.x) * k; bandi.y += (pp.y - bandi.y) * k;
  updateParticles(dt);
  if (playing && !busy && !modal) { const n = checkSpotted(); if (n) runEvent(() => caught(n)); }
  saveAcc += dt; if (saveAcc > 2) { saveAcc = 0; save(); }
  updateHUD();
}
let last = performance.now();
function loop(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; update(dt); render(now / 1000); requestAnimationFrame(loop); }

/* ===================== 시작 ===================== */
const iconURL = (rows, pal) => sprite(rows, pal).toDataURL();

root.setProperty('--cur', `url(${iconURL(["k....", "kyk..", "kyyk.", "kyyyk", "kyyk.", "kyk..", "k...."], { k: '#2b1d1d', y: '#ffd23f' })})`);
root.setProperty('--down', `url(${iconURL(["kkkkkkk", "kyyyyyk", ".kyyyk.", "..kyk..", "...k..."], { k: '#2b1d1d', y: '#ffd23f' })})`);
root.setProperty('--gear', `url(${iconURL(["...###...", ".#.###.#.", ".#######.", "###...###", "###...###", "###...###", ".#######.", ".#.###.#.", "...###..."], { '#': '#6a5a48' })})`);
root.setProperty('--shard', `url(${iconURL(["kkkkkkk", "kwwwwwk", "kwdwdwk", "kwdwdwk", "kwdwwwk", "kwwwwwk", "kkkkkkk"], { k: '#2b1d1d', w: '#f6ead0', d: '#2a2228' })})`);
root.setProperty('--panok', `url(${iconURL(["....rr....", "...kkkk...", "..kbbbbk..", ".kbrbbrbk.", "kkkkkkkkkk", ".kwwwwwwk.", "..kkkkkk.."], { k: '#2b1d1d', b: '#8a5a32', r: '#c0392b', w: '#6a4426' })})`);
root.setProperty('--wae', `url(${iconURL(["....kk....", "...kwwk...", "...kwwk...", "...kwwk...", "kkkkkkkkkk", ".kddddddk.", "..kkkkkk.."], { k: '#1a1418', w: '#e8e2d2', d: '#c0392b' })})`);
root.setProperty('--shard0', `url(${iconURL(["kkkkkkk", "k.....k", "k.....k", "k.....k", "k.....k", "k.....k", "kkkkkkk"], { k: '#8a8aa8' })})`);
function fit() {
  const touch = matchMedia('(hover:none),(pointer:coarse)').matches;
  const fk = Math.min((innerWidth - 16) / W, (innerHeight - (touch ? 150 : 0) - 16) / H);
  const k = fk >= 2 ? Math.floor(fk) : Math.max(.8, fk), u = fk >= 2 ? Math.max(1, Math.round(k / 1.5)) : 1;
  $('#game').style.width = Math.round(W * k) + 'px';
  root.setProperty('--k', k); root.setProperty('--u', u);
}
addEventListener('resize', fit); fit();
applyQLink();
toTitle();
requestAnimationFrame(loop);

</script>
